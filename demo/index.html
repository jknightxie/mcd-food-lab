olor: #f2efe8; }\n.t-midnight .qz-ans .miss { color: #ff7b72; }\n.t-midnight .qz-no, .t-midnight .qz-note { color: #9a9384; }\n/* 深夜底吃光深红，印泥提亮并加重 —— 不然盖上看不见 */\n.t-midnight .qz-seal { color: #ff6a52; opacity: .68; }\n.t-retro .qz-row { border-bottom-color: rgba(58,36,21,.2); }\n.t-retro .qz-ans { color: #8a6a45; }\n.t-retro .qz-ans b { color: #3a2415; }\n.t-retro .qz-no, .t-retro .qz-note { color: #8a6a45; }\n.t-retro .qz-seal { color: #a33327; opacity: .6; }\n.t-receipt .qz-row { border-bottom: 1px dashed #c9c4b6; }\n/* 小票的印泥是墨黑，方角 —— 像票据上洇开的印 */\n.t-receipt .qz-seal { color: #1a1a1a; border-radius: 3px; opacity: .5; }\n\n/* ── 点餐单 ── */\n.od { padding: 20px 16px 8px; }\n.od-head {\n  display: flex; justify-content: space-between; align-items: baseline;\n  gap: 10px; margin-bottom: 12px;\n}\n.od-title { font-size: 14.5px; font-weight: 900; }\n.od-note { font-size: 10.5px; color: var(--tan); font-weight: 600; }\n.od-row { padding: 9px 0; border-bottom: 1.5px dashed rgba(26,26,26,.18); }\n.od-row:last-child { border-bottom: none; }\n.od-top { display: flex; align-items: baseline; gap: 8px; }\n.od-qty {\n  flex: none; min-width: 26px; font-size: 12px; font-weight: 900;\n  color: var(--tan); font-variant-numeric: tabular-nums;\n}\n.od-name { font-size: 14px; font-weight: 800; flex: 1; min-width: 0; }\n.od-price {\n  flex: none; font-size: 14px; font-weight: 900;\n  font-variant-numeric: tabular-nums;\n}\n.od-sub {\n  margin-top: 3px; font-size: 11.5px; color: var(--tan); font-weight: 600;\n  font-variant-numeric: tabular-nums;\n}\n.od-src {\n  margin: 12px 16px 0; border: 1.5px dashed var(--tan); border-radius: 10px;\n  padding: 9px 11px; font-size: 11px; color: var(--tan); line-height: 1.6;\n}\n.od-src b { color: var(--ink); }\n.t-midnight .od-row { border-bottom-color: rgba(242,239,232,.15); }\n.t-midnight .od-name { color: #f2efe8; }\n.t-midnight .od-qty, .t-midnight .od-sub, .t-midnight .od-note { color: #9a9384; }\n.t-midnight .od-src { border-color: #55524a; colo "纯牛奶(盒装)", "双层吉士汉堡", "巨无霸"], "correct": 1, "reveal": "纯牛奶(盒装)：每 1 元 = 22.00 毫克钙。总量高的不一定是冠军 —— 除以价格才知道。抢的是钙王，算的是每元。"}], "cards": {"0": "\u003c!DOCTYPE html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>麦门战力测试 · 麦门路人\u003c/title>\n__SHARED_CARD_CSS__\n\u003c/head>\n\u003cbody class=\"t-classic\">\n\u003cdiv class=\"style-switch\">\u003cbutton data-style=\"classic\" class=\"on\">经典黄黑\u003c/button>\u003cbutton data-style=\"midnight\" class=\"\">深夜黑金\u003c/button>\u003cbutton data-style=\"receipt\" class=\"\">营养小票\u003c/button>\u003cbutton data-style=\"retro\" class=\"\">复古海报\u003c/button>\u003c/div>\u003cdiv class=\"card t-classic\">\n  \u003cdiv class=\"strip\">\n    \u003cdiv class=\"m-badge\">M\u003c/div>\n    \u003cdiv class=\"strip-name\">麦门食验室\u003c/div>\n    \u003cdiv class=\"strip-tag\">战力测试\u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"hero\">\n    \u003cdiv class=\"eyebrow\">麦门战力测试 · 实时菜单 · 北京建外SOHO(A座)\u003c/div>\n    \u003cdiv class=\"champ\">麦门路人\u003c/div>\n    \u003cdiv class=\"signature\">答对 \u003cb>0\u003c/b> / 3 题\u003c/div>\n    \u003cdiv class=\"champ-sub\">你对麦当劳的力量一无所知\u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"sticker\">第 1 题的反转：那么大鸡排（椒盐风味） 才是每元蛋白王，比巨无霸高 \u003cb>62%\u003c/b>\u003c/div>\n\n  \u003cdiv class=\"qz\">\n    \u003cdiv class=\"qz-head\">\n      \u003cspan class=\"qz-title\">逐题复盘\u003c/span>\n      \u003cspan class=\"qz-note\">全部来自本店实测数据\u003c/span>\n    \u003c/div>\n    \u003cdiv class=\"qz-row\">\u003cdiv class=\"qz-top\">\u003cspan class=\"qz-no\">Q1\u003c/span>\u003cspan class=\"qz-q\">你：「我猜那么大鸡排（椒盐风味）的蛋白比巨无霸多，对吧？」我：「……你再想想。」你：「难道不是吗？」我：「别猜了，做题。巨无霸 和 那么大鸡排（椒盐风味），谁蛋白更多？」\u003c/span>\u003c/div>\u003cdiv class=\"qz-body\">\u003cdiv class=\"qz-ans\">你答了 \u003cspan class=\"miss\">{{Q0}}\u003c/span>，正确是 \u003cb>巨无霸\u003c/b>\u003c/div>\u003cdiv class=\"qz-reveal\">巨无霸 27g &gt; 那么大鸡排（椒盐风味） 24g。总量这一局，巨无霸赢。下次猜之前，先问小票。\u003c/div>\u003cspan class=\"qz-seal qz-bad\">错\u003c/span>\u003c/div>\u003cdiv class=\"qz-row\">\u003cdiv class=\"qz-top\">\u003cspan class=\"qz-no\">Q2\u003c/span>\u003cspan class=\"qz-q\">你在点餐机前纠结了 8 分钟，最后点了和上次一样的那款。8 分钟，够把每元蛋白算两遍了。巨无霸 和 那么大鸡排（椒盐风味），谁高？\u003c/span>\u003c/div>\u003cdiv class=\"qz-body\">\u003cdiv class=\"qz-ans\">你答了 \u003cspan class=\"miss\">{{Q1}}\u003c/span>，正确是 \u003cb>那么大鸡排（椒盐风味）\u003c/b>\u003c/div>\u003cdiv class=\"qz-reveal\">那么大鸡排（椒盐风味） 1.71 g/元 vs 巨无霸 1.06 g/元 —— 每元高 62%，还便宜 11.5 元。这就是「每元效率」存在的意义。纠结 8 分钟选的款，效率未必纠结过你。\u003c/div>\u003cspan class=\"qz-seal qz-bad\">错\u003c/span>\u003c/div>\u003cdiv class=\"qz-row\">\u003cdiv class=\"qz-top\">\u003cspan class=\"qz-no\">Q3\u003c/span>\u003cspan class=\"qz-q\">健身房里两个大汉同时把手伸向最后一格补给——不为好喝，为全店每 1 元补钙王。问：这款「钙王」是谁？\u003c/span>\u003c/div>\u003cdiv class=\"qz-body\">\u003cdiv class=\"qz-ans\">你答了 \u003cspan class=\"miss\">{{Q2}}\u003c/span>，正确是 \u003cb>纯牛奶(盒装)\u003c/b>\u003c/div>\u003cdiv class=\"qz-reveal\">纯牛奶(盒装)：每 1 元 = 22.00 毫克钙。总量高的不一定是冠军 —— 除以价格才知道。抢的是钙王，算的是每元。\u003c/div>\u003cspan class=\"qz-seal qz-bad\">错\u003c/span>\u003c/div>\n  \u003c/div>\n  \n  \u003cdiv class=\"cut\">\u003cspan>数据边界\u003c/span>\u003c/div>\n  \u003cdiv class=\"cover\">\n    \u003cdiv class=\"cover-num\">20%\u003ci>有营养数据\u003c/i>\u003c/div>\n    \u003cdiv class=\"cover-txt\">\n      本店 \u003cb>100\u003c/b> 款在售，有营养数据的 \u003cb>20\u003c/b> 款。\n      没查到的（麦辣鸡腿汉堡三件套、三文鱼双虾至尊月堡、阳光橙麦炫酷、马苏里拉拉丝芝士条 等 80 款）\u003cb>不参与推荐\u003c/b> —— 不拿估算值凑数。\n    \u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"foot\">\u003cdiv class=\"foot-brand\">麦门食验室\u003c/div>\u003cdiv class=\"disclaimer\">本项目为参赛作品，非麦当劳官方产品。数据以麦当劳官方渠道实时结果为准。\u003cbr>开源地址：\u003ca href=\"https://github.com/jknightxie/mcd-food-lab\">https://github.com/jknightxie/mcd-food-lab\u003c/a>\u003c/div>\u003c/div>\n\u003c/div>\n\n\u003cscript>\n(function () {\n  var KEYS = [\"classic\", \"midnight\", \"receipt\", \"retro\"];\n  var btns = document.querySelectorAll(\".style-switch button\"); 003cb>纯牛奶(盒装)\u003c/b>\u003c/div>\u003cdiv class=\"qz-reveal\">纯牛奶(盒装)：每 1 元 = 22.00 毫克钙。总量高的不一定是冠军 —— 除以价格才知道。抢的是钙王，算的是每元。\u003c/div>\u003cspan class=\"qz-seal qz-bad\">错\u003c/span>\u003c/div>\n  \u003c/div>\n  \n  \u003cdiv class=\"cut\">\u003cspan>数据边界\u003c/span>\u003c/div>\n  \u003cdiv class=\"cover\">\n    \u003cdiv class=\"cover-num\">20%\u003ci>有营养数据\u003c/i>\u003c/div>\n    \u003cdiv class=\"cover-txt\">\n      本店 \u003cb>100\u003c/b> 款在售，有营养数据的 \u003cb>20\u003c/b> 款。\n      没查到的（麦辣鸡腿汉堡三件套、三文鱼双虾至尊月堡、阳光橙麦炫酷、马苏里拉拉丝芝士条 等 80 款）\u003cb>不参与推荐\u003c/b> —— 不拿估算值凑数。\n    \u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"foot\">\u003cdiv class=\"foot-brand\">麦门食验室\u003c/div>\u003cdiv class=\"disclaimer\">本项目为参赛作品，非麦当劳官方产品。数据以麦当劳官方渠道实时结果为准。\u003cbr>开源地址：\u003ca href=\"https://github.com/jknightxie/mcd-food-lab\">https://github.com/jknightxie/mcd-food-lab\u003c/a>\u003c/div>\u003c/div>\n\u003c/div>\n\n\u003cscript>\n(function () {\n  var KEYS = [\"classic\", \"midnight\", \"receipt\", \"retro\"];\n  var btns = document.querySelectorAll(\".style-switch button\");\n  var card = document.querySelector(\".card\");\n  function apply(s) {\n    KEYS.forEach(function (k) {\n      document.body.classList.remove(\"t-\" + k);\n      if (card) card.classList.remove(\"t-\" + k);\n    });\n    document.body.classList.add(\"t-\" + s);\n    if (card) card.classList.add(\"t-\" + s);\n    btns.forEach(function (b) {\n      b.classList.toggle(\"on\", b.getAttribute(\"data-style\") === s);\n    });\n  }\n  btns.forEach(function (b) {\n    b.addEventListener(\"click\", function () { apply(b.getAttribute(\"data-style\")); });\n  });\n  // 暴露给宿主页：演示页要按本次随机主题给每张卡定初始外观\n  // （宿主只换主题、不复制主题逻辑 —— 否则两份实现迟早会漂）\n  window.__cardSetStyle = apply;\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>", "3": "\u003c!DOCTYPE html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>麦门战力测试 · 麦门百晓生 entListener(\"click\", function () { apply(b.getAttribute(\"data-style\")); });\n  });\n  // 暴露给宿主页：演示页要按本次随机主题给每张卡定初始外观\n  // （宿主只换主题、不复制主题逻辑 —— 否则两份实现迟早会漂）\n  window.__cardSetStyle = apply;\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>"}}, {"seed": 7, "questions": [{"text": "麦门奥运会「蛋白质总量」项目颁奖典礼开始——金牌是？", "options": ["那么大鸡排（椒盐风味）", "一样多", "巨无霸"], "correct": 2, "reveal": "巨无霸 27g > 那么大鸡排（椒盐风味） 24g。总量这一局，巨无霸赢。"}, {"text": "「小孩子才做选择，大人全都要。」钱包说：大人只配选每元蛋白高的。巨无霸 和 那么大鸡排（椒盐风味），选谁？", "options": ["那么大鸡排（椒盐风味）", "一样多", "巨无霸"], "correct": 0, "reveal": "那么大鸡排（椒盐风味） 1.71 g/元 vs 巨无霸 1.06 g/元 —— 每元高 62%，还便宜 11.5 元。这就是「每元效率」存在的意义。全都要的前提，是全都有预算。"}, {"text": "小孩在麦当劳生日派对许愿：「希望每 1 元都能多补点钙。」问：哪款能替圣诞老人实现这个愿望？", "options": ["培根安格斯厚牛堡", "纯牛奶(盒装)", "双层吉士汉堡", "巨无霸"], "correct": 1, "reveal": "纯牛奶(盒装)：每 1 元 = 22.00 毫克钙。总量高的不一定是冠军 —— 除以价格才知道。圣诞老人送礼物，食验室送数据。"}], "cards": {"0": "\u003c!DOCTYPE html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>麦门战力测试 · 麦门路人\u003c/title>\n__SHARED_CARD_CSS__\n\u003c/head>\n\u003cbody class=\"t-classic\">\n\u003cdiv class=\"style-switch\">\u003cbutton data-style=\"classic\" class=\"on\">经典黄黑\u003c/button>\u003cbutton data-style=\"midnight\" class=\"\">深夜黑金\u003c/button>\u003cbutton data-style=\"receipt\" class=\"\">营养小票\u003c/button>\u003cbutton data-style=\"retro\" class=\"\">复古海报\u003c/button>\u003c/div>\u003cdiv class=\"card t-classic\">\n  \u003cdiv class=\"strip\">\n    \u003cdiv class=\"m-badge\">M\u003c/div>\n    \u003cdiv class=\"strip-name\">麦门食验室\u003c/div>\n    \u003cdiv class=\"strip-tag\">战力测试\u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"hero\">\n    \u003cdiv class=\"eyebrow\">麦门战力测试 · 实时菜单 · 北京建外SOHO(A座)\u003c/div>\n    \u003cdiv class=\"champ\">麦门路人\u003c/div>\n    \u003cdiv class=\"signature\">答对 \u003cb>0\u003c/b> / 3 题\u003c/div>\n    \u003cdiv class=\"champ-sub\">你对麦当劳的力量一无所知\u003c/div>\n  \u003c/div>\n\n  \u003cdiv cla span>，正确是 \u003cb>纯牛奶(盒装)\u003c/b>\u003c/div>\u003cdiv class=\"qz-reveal\">纯牛奶(盒装)：每 1 元 = 22.00 毫克钙。总量高的不一定是冠军 —— 除以价格才知道。圣诞老人送礼物，食验室送数据。\u003c/div>\u003cspan class=\"qz-seal qz-bad\">错\u003c/span>\u003c/div>\n  \u003c/div>\n  \n  \u003cdiv class=\"cut\">\u003cspan>数据边界\u003c/span>\u003c/div>\n  \u003cdiv class=\"cover\">\n    \u003cdiv class=\"cover-num\">20%\u003ci>有营养数据\u003c/i>\u003c/div>\n    \u003cdiv class=\"cover-txt\">\n      本店 \u003cb>100\u003c/b> 款在售，有营养数据的 \u003cb>20\u003c/b> 款。\n      没查到的（麦辣鸡腿汉堡三件套、三文鱼双虾至尊月堡、阳光橙麦炫酷、马苏里拉拉丝芝士条 等 80 款）\u003cb>不参与推荐\u003c/b> —— 不拿估算值凑数。\n    \u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"foot\">\u003cdiv class=\"foot-brand\">麦门食验室\u003c/div>\u003cdiv class=\"disclaimer\">本项目为参赛作品，非麦当劳官方产品。数据以麦当劳官方渠道实时结果为准。\u003cbr>开源地址：\u003ca href=\"https://github.com/jknightxie/mcd-food-lab\">https://github.com/jknightxie/mcd-food-lab\u003c/a>\u003c/div>\u003c/div>\n\u003c/div>\n\n\u003cscript>\n(function () {\n  var KEYS = [\"classic\", \"midnight\", \"receipt\", \"retro\"];\n  var btns = document.querySelectorAll(\".style-switch button\");\n  var card = document.querySelector(\".card\");\n  function apply(s) {\n    KEYS.forEach(function (k) {\n      document.body.classList.remove(\"t-\" + k);\n      if (card) card.classList.remove(\"t-\" + k);\n    });\n    document.body.classList.add(\"t-\" + s);\n    if (card) card.classList.add(\"t-\" + s);\n    btns.forEach(function (b) {\n      b.classList.toggle(\"on\", b.getAttribute(\"data-style\") === s);\n    });\n  }\n  btns.forEach(function (b) {\n    b.addEventListener(\"click\", function () { apply(b.getAttribute(\"data-style\")); });\n  });\n  // 暴露给宿主页：演示页要按本次随机主题给每张卡定初始外观\n  // （宿主只换主题、不复制主题逻辑 —— 否则两份实现迟早会漂）\n  window.__cardSetStyle = apply;\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>", "2": "\u003c!DOCTYPE html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle const CSS_SLOT = "__SHARED_CARD_CSS__";

/* ── 每次打开随机一份：一套题 / 一个默认场景 / 一单点餐单 ──
   页面是冻结快照（运行时不碰 MCP），所以"随机"只决定**展示哪一份真实数据**：
   数字永远来自实测，随机的只是这次先给你看哪一面。刷新即换。 */
function pickOne(list) { return list[Math.floor(Math.random() * list.length)]; }
const SET = pickOne(DATA.quizSets);
const START_SCENE = pickOne(DATA.sceneOrder);
const ORDER = pickOne(DATA.orderCards);
const THEME = pickOne(DATA.styles);   // 本次主题：四种随机一种（卡片顶部仍可随时换）

/* ── 卡片：srcdoc 直接灌入 card.py 的真实渲染结果 ──
   两个坑（真踩过）：
   1. 面板初始 display:none —— 隐藏容器里的 iframe 量不到高度（body.scrollHeight≈0），
      直接写进 style.height 会把卡片压成 0px，切过去就是一片空白。
      量到可疑高度就**跳过**，保留 HTML 上的默认 height，等可见时再补量。
   2. 量高度不能读根元素的 scrollHeight —— 它被 iframe **自身**高度撑大
      （卡 774px 高、iframe 1000px 时它报 1000，永远「量不准」）。
      要读 body 的 scrollHeight（只反映内容，与视口无关）。
   补量用三保险：ResizeObserver（卡内变高）+ 切页签时补量 + 低速定时兜底。 */
function fit(frame) {
  try {
    const d = frame.contentDocument;
    if (!d || !d.body) return;
    const h = d.body.scrollHeight || 0;
    if (!h || h < 60) return;               // 隐藏中量不到：不覆盖默认高度
    const want = h + 12;                    // + 卡片 9px 硬阴影的外溢余量
    if (frame.dataset.fit !== String(want)) {
      frame.dataset.fit = String(want);
      frame.style.height = want + "px";
    }
  } catch (e) { /* 读不到就保留默认高度 */ }
}
function watch(frame) {
  try {
    const d = frame.contentDocument;
    if (!d || !window.ResizeObserver) return;
    new ResizeObserver(() => fit(frame)).observe(d.body);
  } catch (e) { /* 跨源或不可读：靠 showTab/load 兜底 */ }
}
function put(frame, html) {
  delete frame.dataset.fit;
  frame.onload = () => {
    try { frame.contentWindow.__cardSetStyle?.(THEME); } catch (e) {}
    fit(frame); watch(frame);
  };
  // 卡片 CSS 全页共享一份（见 build_demo.py 的 _dedupe_card_css）：这里展开回去
  frame.srcdoc = html.split(CSS_SLOT).join(`<style>${DATA.cardCss}</style>`);
  setTimeout(() => fit(frame), 160);
}
function refit(scope) {
  scope.querySelectorAll("iframe").forEach((f) =>
    requestAnimationFrame(() => setTimeout(() => fit(f), 30)));
}

/* ── 标签页（支持 #quiz / #scenes / #order 深链）── */
function showTab(name) {
  const btn = document.querySelector(`.tabs button[data-tab="${name}"]`);
  if (!btn) return;
  document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("on", b === btn));
  document.querySelectorAll(".panel").forEach(p => p.classList.remove("on"));
  const panel = document.getElementById("panel-" + name);
  panel.classList.add("on");
  refit(panel);  // 显形后立刻补量一次（隐藏期间量不到高度）
}
window.addEventListener("resize", () => refit(document));
document.getElementById("tabs").addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-tab]");
  if (btn) showTab(btn.dataset.tab);
});
window.addEventListener("hashchange", () => showTab(location.hash.slice(1)));

/* ── 玩法一：答题（题目来自快照，卡片的题面与它同源）── */
const state = { i: 0, picks: [], done: false };
const Q = SET.questions;  // 随机抽中的那一套（每套题数与段位表一致）

function renderQuestion() {
  const box = document.getElementById("qbox");
  const q = Q[state.i];
  const letters = "ABCD";
  box.innerHTML = `
    <div class="qmeta">Q${state.i + 1} / ${Q.length}</div>
    <div class="qtext">${q.text}</div>
    <div class="opts" id="opts"></div>
    <div id="verdict"></div>`;
  const opts = document.getElementById("opts");
  q.options.forEach((text, idx) => {
    const b = document.createElement("button");
    b.textContent = `${letters[idx]}. ${text}`;
    b.onclick = () => answer(idx);
    opts.appendChild(b);
  });
}

function answer(pick) {
  const q = Q[state.i];
  const right = pick === q.correct;
  state.picks.push(pick);
  const letters = "ABCD";
  const btns = [...document.querySelectorAll("#opts button")];
  btns.forEach((b, idx) => {
    b.disabled = true;
    if (idx === q.correct) b.classList.add("pick-right");
    else if (idx === pick) b.classList.add("pick-wrong");
  });
  document.getElementById("verdict").innerHTML = `
    <div class="verdict ${right ? "ok" : "no"}">
      ${right ? "✓ 答对了：" + q.options[q.correct] : "✗ 你答了 " + q.options[pick] + "，正确是 " + q.options[q.correct]}
    </div>
    <div class="reveal">${q.reveal}</div>`;

  const next = document.createElement("button");
  next.className = "nextbtn";
  const last = state.i === Q.length - 1;
  next.textContent = last ? "看我的战报卡 →" : "下一题 →";
  next.onclick = () => { state.i += 1; last ? finish() : renderQuestion(); };
  document.getElementById("qbox").appendChild(next);
}

function finish() {
  state.done = true;
  document.getElementById("qbox").hidden = true;
  let bits = 0;
  Q.forEach((q, i) => { if (state.picks[i] === q.correct) bits |= (1 << i); });
  const score = Q.filter((q, i) => state.picks[i] === q.correct).length;
  const [title, tagline] = DATA.ranks[String(score)];
  document.getElementById("final").hidden = false;
  document.getElementById("rankTitle").textContent = title;
  document.getElementById("rankNote").textContent = tagline + ` · 答对 ${score} / ${Q.length}`;
  document.getElementById("quizCardBox").hidden = false;  // 答完才露出战报卡
  let html = SET.cards[String(bits)];
  Q.forEach((q, i) => {
    if (state.picks[i] !== q.correct) {
      html = html.split(`{{Q${i}}}`).join(q.options[state.picks[i]]);
    }
  });
  put(document.getElementById("quizCard"), html);
}

/* ── 玩法二：六场景切换 ── */
const scenesBox = document.getElementById("scenes");
DATA.sceneOrder.forEach((key) => {
  const b = document.createElement("button");
  b.dataset.scene = key;
  b.textContent = DATA.sceneLabels[key];
  b.onclick = () => {
    scenesBox.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
    put(document.getElementById("sceneCard"), DATA.sceneCards[key]);
  };
  scenesBox.appendChild(b);
});
scenesBox.querySelector(`button[data-scene="${START_SCENE}"]`)?.classList.add("on");

/* ── 初始化 ── */
renderQuestion();
put(document.getElementById("sceneCard"), DATA.sceneCards[START_SCENE]);
put(document.getElementById("orderCard"), ORDER.card);
document.getElementById("quizHint").textContent =
  `题目、选项、揭示全部由快照数据生成 —— 本次主题「${DATA.styleLabels[THEME]}」，`
  + "卡片顶部可随时换；刷新页面换一套题、换一种主题。";
document.getElementById("sceneHint").textContent =
  `六个场景各有一套排序标准 —— 本次默认「${DATA.sceneLabels[START_SCENE]}」，点按钮换场景。`;
document.getElementById("orderHint").textContent =
  `这一单是「${ORDER.spec}」（¥${ORDER.total.toFixed(1)}，${ORDER.source === "calculate-price" ? "实时计价" : "菜单标价"}）。`
  + "点餐单是只读产出；真实下单要用户明确确认，回传支付链接且随时可退。";
/* 低速兜底：隐藏期间量不到高度的卡，显形后自动补上（高度稳定后不再写入）*/
setInterval(() => document.querySelectorAll("iframe").forEach(fit), 400);
if (location.hash) showTab(location.hash.slice(1));
</script>

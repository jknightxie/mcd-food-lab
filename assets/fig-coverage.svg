  <title>覆盖率：四城七店实测 18%~21%</title>
  <desc>每 100 款在售餐品，约 20 款能在官方营养库里查到，其余一律不推荐也不用估算值凑数。门店规模差近一倍，覆盖率却纹丝不动。</desc>

